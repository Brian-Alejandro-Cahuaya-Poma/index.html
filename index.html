<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌻 Flores Amarillas para Rossangela 🌻</title>

<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">

<style>

/* Fondo */
body {
    margin: 0;
    background: linear-gradient(to top, #000000, #020024);
    overflow: hidden;
    font-family: 'Indie Flower', cursive;
    color: white;
    text-align: center;
}

/* Título */
h1 {
    position: absolute;
    top: 20px;
    width: 100%;
    font-size: 28px;
}

/* Overlay inicio */
#overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
    cursor: pointer;
}

#overlay img {
    width: 120px;
}

/* Flores */
.flower {
    position: absolute;
    bottom: -100px;
    width: 20px;
    height: 20px;
    background: yellow;
    border-radius: 50%;
    animation: grow 5s infinite;
}

@keyframes grow {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
}

/* Corazones */
.heart {
    position: absolute;
    color: pink;
    animation: float 6s infinite;
}

@keyframes float {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100vh); opacity: 0; }
}

</style>
</head>

<body>

<div id="overlay" onclick="start()">
    <h2>Toca para abrir 💛</h2>
    <img src="https://cdn-icons-png.flaticon.com/512/833/833472.png">
</div>

<h1>🌻 Feliz Día de las Flores Amarillas ROSSANGELA 🌻</h1>

<audio id="music" loop>
    <source src="https://flores-amarillas-de-marzo.netlify.app/assets/sound.mp3" type="audio/mpeg">
</audio>

<script>

/* Iniciar */
function start() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("music").play();

    crearFlores();
    crearCorazones();
}

/* Flores */
function crearFlores() {
    setInterval(() => {
        let f = document.createElement("div");
        f.className = "flower";
        f.style.left = Math.random() * 100 + "vw";
        f.style.animationDuration = (3 + Math.random()*3) + "s";
        document.body.appendChild(f);

        setTimeout(() => f.remove(), 6000);
    }, 300);
}

/* Corazones */
function crearCorazones() {
    setInterval(() => {
        let h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = "💛";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = (10 + Math.random()*20) + "px";
        document.body.appendChild(h);

        setTimeout(() => h.remove(), 6000);
    }, 500);
}

</script>

</body>
</html>
